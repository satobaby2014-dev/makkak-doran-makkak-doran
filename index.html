<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>쌓기나무 놀이터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;background:rgba(255,255,255,.92);border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:96vw}
#top{top:calc(10px + env(safe-area-inset-top,0px))}#bot{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
button{font:inherit;font-size:15px;padding:10px 14px;min-height:44px;border:0;border-radius:12px;background:#e8eefc;color:#223;cursor:pointer}
button.on{background:#3b6cff;color:#fff}
button.red{background:#ff5a5a;color:#fff}
.sw{width:38px;height:38px;min-height:38px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #aaa}
.sw.on{box-shadow:0 0 0 3px #3b6cff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#box{background:#fff;border-radius:18px;padding:18px;text-align:center;max-width:92vw}
#qr{display:flex;justify-content:center;margin:10px 0}
video{width:min(80vw,360px);border-radius:12px;background:#000}
#info{position:fixed;left:10px;top:calc(78px + env(safe-area-inset-top,0px));font-size:13px;color:#234;background:rgba(255,255,255,.7);padding:6px 10px;border-radius:10px}
#cnt{position:fixed;right:10px;top:calc(78px + env(safe-area-inset-top,0px));font-size:18px;font-weight:700;color:#fff;background:#3b6cff;padding:8px 14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#jg{position:fixed;inset:0;display:none;z-index:10;background:#b9ddff;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#jg canvas{position:absolute;inset:0}
#jgT{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;padding:8px 14px;border-radius:10px;background:rgba(30,30,30,.65);color:#fff;font-weight:800;font-size:15px}
#jgX{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;background:rgba(30,30,30,.7);color:#fff}
#jgP{position:absolute;top:calc(54px + env(safe-area-inset-top,0px));left:10px;padding:5px 12px;border-radius:10px;background:rgba(30,30,30,.55);color:#fff;font-size:13px;font-weight:700;display:none}
#jgScore{position:absolute;top:calc(88px + env(safe-area-inset-top,0px));left:10px;padding:5px 12px;border-radius:10px;background:rgba(30,30,30,.55);color:#fff;font-size:13px;font-weight:700;pointer-events:none}
#jgFeed{position:absolute;top:calc(122px + env(safe-area-inset-top,0px));left:10px;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
#jgFeed div{margin-top:3px;background:rgba(30,30,30,.45);padding:3px 8px;border-radius:8px;width:fit-content}
#jgHint{position:absolute;left:0;right:0;top:28%;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;transition:opacity 1s;padding:0 12px}
#jgJoy{position:absolute;left:24px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.7);touch-action:none}
#jgKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.88);pointer-events:none}
#jgJump{position:absolute;right:28px;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:86px;height:86px;min-height:86px;padding:0;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.85);color:#fff;font-weight:800;font-size:16px;touch-action:none}
#jgJump:active{background:rgba(255,255,255,.6)}
#jgFire{position:absolute;right:128px;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:74px;height:74px;min-height:74px;padding:0;border-radius:50%;background:rgba(255,90,60,.65);border:2px solid rgba(255,255,255,.9);font-size:32px;touch-action:none}
#jgFire:active{background:rgba(255,50,20,.9)}
#jgWeap{position:absolute;right:10px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#jgAct{position:absolute;right:128px;bottom:calc(140px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#jgWeap button,#jgAct button{background:rgba(30,30,30,.65);color:#fff;font-size:18px;padding:6px 12px}
#jgWeap button.on,#jgAct button.on{background:#ff8a2b}
#jgHPw{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(34vw,220px);text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#jgHPb{height:14px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.7)}
#jgHPf{height:100%;width:100%;background:#4cd964}
#jgHPt,#jgAmmo{font-size:13px;margin-top:2px}
#jgCross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;display:none}
#jgCross::before,#jgCross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#jgCross::before{left:12px;top:0;width:2px;height:26px}
#jgCross::after{top:12px;left:0;height:2px;width:26px}
#jgHM{position:absolute;left:50%;top:50%;margin:-14px 0 0 -14px;width:28px;height:28px;pointer-events:none;opacity:0;color:#fff;font-size:26px;line-height:28px;text-align:center;text-shadow:0 0 4px #f00}
#jgScope{position:absolute;inset:0;pointer-events:none;display:none;background:radial-gradient(circle at center,transparent 0,transparent 33vmin,#000 33.5vmin)}
#jgScope::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.85)}
#jgScope::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(0,0,0,.85)}
#jgPopW{position:absolute;left:50%;top:38%;width:0;height:0;pointer-events:none}
.jgPop{position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 4px #000;animation:jgUp .9s ease-out forwards}
.jgPop.head{color:#ff5050;font-size:26px}
.jgPop.kill{color:#ffd23c;font-size:28px}
@keyframes jgUp{0%{opacity:1;top:0}100%{opacity:0;top:-60px}}
#jgDead{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:24px;text-align:center;pointer-events:none;padding:0 20px}
#jgHit{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,255,255,.15) 25%,rgba(220,30,30,.6) 100%)}
#jgSide{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:10px;display:flex;flex-direction:column;gap:8px}
#jgSide button,#jgEmoP button{background:rgba(30,30,30,.7);color:#fff;font-size:20px;padding:8px 12px}
#jgEmoP{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:64px;display:none;flex-direction:column;gap:6px}
#jgEmoP button{font-size:14px;text-align:left;white-space:nowrap}
#jgChat{position:absolute;left:10px;right:10px;bottom:calc(190px + env(safe-area-inset-bottom,0px));max-width:460px;display:none;gap:6px}
#jgIn{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:0;border-radius:12px;user-select:text;-webkit-user-select:text}
#jgSend{background:#3b6cff;color:#fff}
#yar{position:fixed;inset:0;background:#f7f7f7;display:none;align-items:center;justify-content:center;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
#yarX{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px}
#yarT{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:12px;font-size:13px;color:#777}
#yarCv{width:auto;height:auto}
textarea{width:min(80vw,340px);height:60px;font-size:11px}
</style>
</head>
<body>
<div class="bar" id="top">
  <button id="mAdd" class="on">➕ 설치</button>
  <button id="mDel">🧽 지우기</button>
  <button id="mMulti">▦ 여러개(영역)</button>
  <span id="pal" style="display:flex;gap:6px;align-items:center"></span>
</div>
<div id="info">한 손가락 드래그: 시점 회전 · 두 손가락: 확대/이동 · 톡 터치: 설치</div>
<div id="cnt">🧱 0개</div>
<div class="bar" id="bot">
  <button id="bSpin">🔄 360° 돌려보기</button>
  <button id="bFront">👀 정면</button>
  <button id="bSide">👉 옆(오른쪽)</button>
  <button id="bTop">⬆ 위</button>
  <button id="bView">🎯 시점 초기화</button>
  <button id="bShare">📤 QR 공유</button>
  <button id="bScan">📷 QR 스캔</button>
  <button id="bPhoto">ㄹㅈㄷ 찐땅빵짱세이</button>
  <button id="bBoom">💥 폭파</button>
  <button id="bJun">🎮 준닝이의 게임</button>
  <button id="bYar">🦖 야르야르</button>
  <button id="bClear" class="red">🗑 전부 없애기</button>
</div>
<div id="flash"></div>
<div id="yar"><button id="yarX">✕ 닫기</button><div id="yarT">야르야르 · 화면 터치 / 스페이스 = 점프</div><canvas id="yarCv"></canvas></div>
<div id="jg">
  <div id="jgT">🎮 준닝이의 게임</div><div id="jgP"></div><div id="jgScore"></div><div id="jgFeed"></div>
  <button id="jgX">✕ 나가기</button>
  <div id="jgHint">조이스틱·WASD 이동 · 드래그 조준 · 🔫 발사(F) · 1·2·3 무기 · R 장전 · Q 스코프 · 💬 채팅 · 😀 이모트</div>
  <div id="jgCross"></div><div id="jgHM">✕</div><div id="jgScope"></div><div id="jgPopW"></div>
  <div id="jgJoy"><div id="jgKnob"></div></div>
  <button id="jgJump">점프</button><button id="jgFire">🔫</button>
  <div id="jgAct"><button id="jgScopeB">🔭</button><button id="jgRel">🔄</button></div>
  <div id="jgWeap"><button data-w="k">🔪</button><button data-w="a">🔫</button><button data-w="s">🎯</button></div>
  <div id="jgSide"><button id="jgChatB">💬</button><button id="jgEmoB">😀</button></div>
  <div id="jgEmoP"><button data-e="w">👋 손흔들기</button><button data-e="d">💃 춤추기</button><button data-e="c">🙌 만세</button></div>
  <div id="jgChat"><input id="jgIn" maxlength="40" placeholder="말하기 (최대 40자)" autocomplete="off"><button id="jgSend">보내기</button></div>
  <div id="jgHPw"><div id="jgHPb"><div id="jgHPf"></div></div><div id="jgHPt"></div><div id="jgAmmo"></div></div>
  <div id="jgHit"></div><div id="jgDead"></div>
</div>
<div id="modal"><div id="box"></div></div>

<script>
const N=30, MAXH=15;
const COLORS=[0xff5a5a,0xffa63d,0xffe14d,0x5fd068,0x4db8ff,0x6b6bff,0xc77dff,0xf4f4f4];
let color=0, mode='add';

// ---------- 장면 ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcfe8ff);
scene.fog=new THREE.Fog(0xcfe8ff,60,140);
const camera=new THREE.PerspectiveCamera(50,1,0.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(20,40,15);scene.add(sun);

// 바닥(칸)
const floorMat=new THREE.MeshLambertMaterial({color:0xf2efe6});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(N,N),floorMat);
floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new THREE.GridHelper(N,N,0x889,0xbbb);grid.position.y=0.01;scene.add(grid);
// 방 벽(낮은 벽)
const wallMat=new THREE.MeshLambertMaterial({color:0xe4d8c0});
[[0,-N/2,N,1],[0,N/2,N,1],[-N/2,0,1,N],[N/2,0,1,N]].forEach(([x,z,w,d])=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,2,d),wallMat);
  m.position.set(x,1,z);scene.add(m);
});

function wallsGhost(on){

}

  if(x<0||z<0||x>=N||z>=N||y<0||y>=MAXH||blocks.has(key(x,y,z)))return false;
  const m=new THREE.Mesh(geo,photoOn?photoMat:mats[c]);m.position.copy(toWorld(x,y,z));
  m.add(new THREE.LineSegments(edge,edgeMat));
  m.userData={x,y,z,c};scene.add(m);blocks.set(key(x,y,z),m);return true;
}
function delBlock(x,y,z){
  const m=blocks.get(key(x,y,z));if(!m)return;
  scene.remove(m);blocks.delete(key(x,y,z));
}
function clearAll(){[...blocks.values()].forEach(m=>scene.remove(m));blocks.clear();}

// ---------- 카메라 (3인칭 궤도) ----------
const DEF={th:0.8,ph:0.9,d:34,t:new THREE.Vector3(0,0,0)};
let th=DEF.th,ph=DEF.ph,dist=DEF.d,target=DEF.t.clone(),spin=false,goal=null;
function updCam(){
  ph=Math.max(0.05,Math.min(1.55,ph));dist=Math.max(5,Math.min(80,dist));
  target.x=Math.max(-N/2,Math.min(N/2,target.x));target.z=Math.max(-N/2,Math.min(N/2,target.z));
  camera.position.set(
    target.x+dist*Math.sin(ph)*Math.sin(th),
    target.y+dist*Math.cos(ph),
    target.z+dist*Math.sin(ph)*Math.cos(th));
  camera.lookAt(target);
}
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

// ---------- 입력 (마우스/터치 공통) ----------
const dom=renderer.domElement, ptrs=new Map(), ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let moved=0,t0=0,lastD=0,lastMid=null;
dom.addEventListener('contextmenu',e=>e.preventDefault());
dom.addEventListener('pointerdown',e=>{
  dom.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});
  if(ptrs.size===1){moved=0;t0=performance.now();}
  lastD=0;lastMid=null;goal=null;spin=false;bSpin.classList.remove('on');
});
dom.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse')hover(e.clientX,e.clientY);return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6){wallsGhost(false);th-=dx*0.006;ph-=dy*0.006;ghost.visible=false;}
  }else if(ptrs.size===2){
    moved+=99;
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(lastD)dist*=lastD/d;
    if(lastMid){
      const k=dist*0.0016,mdx=mx-lastMid.x,mdy=my-lastMid.y;
      target.x-=(Math.cos(th)*mdx+Math.sin(th)*mdy)*k;
      target.z-=(-Math.sin(th)*mdx+Math.cos(th)*mdy)*k;
    }
    lastD=d;lastMid={x:mx,y:my};
  }
});
function up(e){
  const p=ptrs.get(e.pointerId);if(!p)return;
  const wasSingle=ptrs.size===1;ptrs.delete(e.pointerId);lastD=0;lastMid=null;
  if(wasSingle&&moved<=6&&performance.now()-t0<500&&e.type==='pointerup'){
    act(e.clientX,e.clientY,p.b===2?'del':mode);
  }
}
dom.addEventListener('pointerup',up);dom.addEventListener('pointercancel',up);
dom.addEventListener('wheel',e=>{e.preventDefault();dist*=1+e.deltaY*0.001;},{passive:false});

function pick(cx,cy){
  mouse.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects([floor,...blocks.values()],false);
  return hits[0]||null;
}
function target3(h,m){ // 설치할 칸 or 지울 블록
  if(!h)return null;
  if(h.object===floor){
    if(m==='del')return null;
    return {x:Math.floor(h.point.x+N/2),y:0,z:Math.floor(h.point.z+N/2)};
  }
  const u=h.object.userData;
  if(m==='del')return u;
  const n=h.face.normal;return {x:u.x+Math.round(n.x),y:u.y+Math.round(n.y),z:u.z+Math.round(n.z)};
}
// 여러개 설치(선택사항): 두 모서리를 차례로 터치하면 사이 영역을 한 번에 설치/삭제
let multi=false,startP=null;
const area=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xff9a3b,transparent:true,opacity:.35,depthWrite:false}));
area.visible=false;scene.add(area);
const clampP=t=>({x:Math.max(0,Math.min(N-1,t.x)),y:Math.max(0,Math.min(MAXH-1,t.y)),z:Math.max(0,Math.min(N-1,t.z))});
function showArea(a,b){
  const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y),z0=Math.min(a.z,b.z),z1=Math.max(a.z,b.z);
  area.scale.set(x1-x0+1.02,y1-y0+1.02,z1-z0+1.02);
  area.position.set(x0-N/2+(x1-x0+1)/2,y0+(y1-y0+1)/2,z0-N/2+(z1-z0+1)/2);area.visible=true;
}
function fill(a,b,m){
  for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++)
  for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++)
  for(let z=Math.min(a.z,b.z);z<=Math.max(a.z,b.z);z++){
    if(m==='del')delBlock(x,y,z);else addBlock(x,y,z,color);
  }
}
function resetMulti(){startP=null;area.visible=false;}
function act(cx,cy,m){
  if(boom)return;
  const t=target3(pick(cx,cy),m);if(!t)return;
  if(multi){
    const p=clampP(t);
    if(!startP){startP=p;showArea(p,p);return;}
    fill(startP,p,m);resetMulti();ghost.visible=false;return;
  }
  if(m==='del')delBlock(t.x,t.y,t.z);else addBlock(t.x,t.y,t.z,color);
  ghost.visible=false;
}
function hover(cx,cy){
  if(multi){
    ghost.visible=false;
    if(startP){const t=target3(pick(cx,cy),mode);if(t)showArea(startP,clampP(t));}
    return;
  }
  if(mode!=='add'){ghost.visible=false;return;}
  const t=target3(pick(cx,cy),'add');
  if(t&&t.x>=0&&t.z>=0&&t.x<N&&t.z<N&&t.y<MAXH&&!blocks.has(key(t.x,t.y,t.z))){
    ghost.position.copy(toWorld(t.x,t.y,t.z));ghost.visible=true;
  }else ghost.visible=false;
}

// 쌓은 블록 전체가 화면에 들어오도록 중심과 거리를 계산
function fitBlocks(){
  if(!blocks.size)return {t:new THREE.Vector3(0,0,0),d:DEF.d};
  const mn=new THREE.Vector3(1e9,1e9,1e9),mx=new THREE.Vector3(-1e9,-1e9,-1e9);
  blocks.forEach(m=>{mn.min(m.position);mx.max(m.position);});
  mn.addScalar(-.5);mx.addScalar(.5);
  const size=mx.clone().sub(mn),c=mn.clone().add(mx).multiplyScalar(.5);
  const r=size.length()/2;
  const half=Math.atan(Math.tan(camera.fov*Math.PI/360)*Math.min(1,camera.aspect));
  return {t:c,d:Math.max(8,Math.min(80,r/Math.sin(half)*1.15))};
}
function goView(a,b){
  const d=(((a-th)%(2*Math.PI))+3*Math.PI)%(2*Math.PI)-Math.PI;
  const f=fitBlocks();
  goal={th:th+d,ph:b,t:f.t,d:f.d};wallsGhost(true);spin=false;bSpin.classList.remove('on');
}
$('bFront').onclick=()=>goView(0,1.55);
$('bSide').onclick=()=>goView(Math.PI/2,1.55);

$('bView').onclick=()=>{goal=null;wallsGhost(false);th=DEF.th;ph=DEF.ph;dist=DEF.d;target.copy(DEF.t);spin=false;bSpin.classList.remove('on');};

// ---------- 💥 폭파 ----------
let boom=null,shake=0;
function startBoom(){
  if(boom||!blocks.size)return;
  const list=[...blocks.values()],c=new THREE.Vector3();
  list.forEach(m=>c.add(m.position));c.divideScalar(list.length);
  const R=()=>Math.random()-.5;
  boom={t:0,last:performance.now(),items:list.map(m=>{
    const dir=m.position.clone().sub(c);dir.y+=1;
    if(dir.lengthSq()<0.01)dir.set(R(),1,R());
    dir.normalize();
    const v=dir.multiplyScalar(6+Math.random()*10);v.y+=8+Math.random()*10;
    return {m,home:m.position.clone(),v,w:new THREE.Vector3(R()*14,R()*14,R()*14)};
  })};
  ghost.visible=false;resetMulti();spin=false;bSpin.classList.remove('on');
  $('bBoom').classList.add('on');
  const fl=$('flash');fl.style.transition='none';fl.style.opacity=.9;void fl.offsetWidth;fl.style.transition='opacity .7s';fl.style.opacity=0;
  shake=1;
}
function stepBoom(){
  if(!boom)return;
  const now=performance.now(),dt=Math.min(0.033,(now-boom.last)/1000);boom.last=now;boom.t+=dt;
  const lim=N/2-0.5,T1=3.2,T2=4.5;
  if(boom.t<T1){
    boom.items.forEach(({m,v,w})=>{
      v.y-=30*dt;m.position.addScaledVector(v,dt);
      m.rotation.x+=w.x*dt;m.rotation.y+=w.y*dt;m.rotation.z+=w.z*dt;
      if(m.position.y<0.5){m.position.y=0.5;v.y*=-0.4;v.x*=0.7;v.z*=0.7;w.multiplyScalar(0.7);if(Math.abs(v.y)<1.2)v.y=0;}
      if(Math.abs(m.position.x)>lim){m.position.x=Math.sign(m.position.x)*lim;v.x*=-0.5;}
      if(Math.abs(m.position.z)>lim){m.position.z=Math.sign(m.position.z)*lim;v.z*=-0.5;}
    });
  }else if(boom.t<T2){
    const q=new THREE.Quaternion();
    boom.items.forEach(({m,home})=>{m.position.lerp(home,0.14);m.quaternion.slerp(q,0.14);});
  }else{
    boom.items.forEach(({m,home})=>{m.position.copy(home);m.rotation.set(0,0,0);});
    boom=null;$('bBoom').classList.remove('on');
  }
}
$('bBoom').onclick=startBoom;

  // ---------- 전투 ----------
  // ---------- 충돌 / 시야 계산 ----------
  let _t0=0,_t1=0,_ok=true;
  function slab(p,dd,lo,hi){
    if(Math.abs(dd)<1e-8){if(p<lo||p>hi)_ok=false;return;}
    let a=(lo-p)/dd,c=(hi-p)/dd;if(a>c){const t=a;a=c;c=t;}
    if(a>_t0)_t0=a;if(c<_t1)_t1=c;if(_t0>_t1)_ok=false;
  }
  function rayBoxes(o,d,maxT){
    let best=maxT;
    for(const b of BOX){
      _t0=0;_t1=best;_ok=true;
      slab(o.x,d.x,b.x0,b.x1);if(!_ok)continue;
      slab(o.y,d.y,0,b.top);if(!_ok)continue;
      slab(o.z,d.z,b.z0,b.z1);if(!_ok)continue;
      if(_t0>0&&_t0<best)best=_t0;
    }
    return best;
  }
  function groundAt(x,z,y,allow){
    let g=0;const e=RAD*0.6;
    for(const b of BOX){
      if(b.top<=y+allow&&b.top>g&&x>b.x0-e&&x<b.x1+e&&z>b.z0-e&&z<b.z1+e)g=b.top;
    }
    return g;
  }
  function moveXZ(dx,dz){
    const allow=P.grounded?2.3:0.3;
    let nx=P.x+dx,nz=P.z+dz;
    for(let it=0;it<3;it++){
      for(const b of BOX){
        if(b.top<=P.y+allow)continue;
        const cx=Math.max(b.x0,Math.min(nx,b.x1)),cz=Math.max(b.z0,Math.min(nz,b.z1));
        const ex=nx-cx,ez=nz-cz,d2=ex*ex+ez*ez;
        if(d2<RAD*RAD){
          if(d2>1e-8){const d=Math.sqrt(d2),k=(RAD-d)/d;nx+=ex*k;nz+=ez*k;}
          else{
            const l=nx-b.x0,r=b.x1-nx,t=nz-b.z0,u=b.z1-nz,m=Math.min(l,r,t,u);
            if(m===l)nx=b.x0-RAD;else if(m===r)nx=b.x1+RAD;else if(m===t)nz=b.z0-RAD;else nz=b.z1+RAD;
          }
        }
      }
    }
    P.x=nx;P.z=nz;
  }
  function freeSpot(x,z){
    for(const b of BOX){if(x>b.x0-RAD-1&&x<b.x1+RAD+1&&z>b.z0-RAD-1&&z<b.z1+RAD+1)return false;}
    return true;
  }
  function dirOf(y,p){const cp=Math.cos(p);return new THREE.Vector3(-Math.sin(y)*cp,-Math.sin(p),-Math.cos(y)*cp);}
  function raySphere(o,d,cx,cy,cz,rad){
    const ox=o.x-cx,oy=o.y-cy,oz=o.z-cz,b=ox*d.x+oy*d.y+oz*d.z,c=ox*ox+oy*oy+oz*oz-rad*rad,disc=b*b-c;
    if(disc<0)return -1;const sq=Math.sqrt(disc);let t=-b-sq;if(t<0)t=-b+sq;return t<0?-1:t;
  }
  function rayCyl(o,d,cx,cz,rad,y0,y1){
    const ox=o.x-cx,oz=o.z-cz,a=d.x*d.x+d.z*d.z;
    if(a<1e-8)return -1;
    const b=ox*d.x+oz*d.z,c=ox*ox+oz*oz-rad*rad,disc=b*b-a*c;
    if(disc<0)return -1;const sq=Math.sqrt(disc);
    for(const t of [(-b-sq)/a,(-b+sq)/a]){if(t<0)continue;const y=o.y+d.y*t;if(y>=y0&&y<=y1)return t;}
    return -1;
  }
  function enemy(r){return !r.dead&&!r.stale&&!(P.tm&&r.tm===P.tm);}
  function fireGun(w){
    const sc=w==='s'?(P.scope?0:0.045):(P.mv?0.02:0.008);
    const y=yaw+(Math.random()-.5)*2*sc,p=pitch+(Math.random()-.5)*2*sc;
    const dir=dirOf(y,p),o=C.position,minT=Math.max(0,camD-3);
    let best=null;
    remotes.forEach((r,id)=>{
      if(!enemy(r))return;
      const g=r.g.position;
      const th=raySphere(o,dir,g.x,g.y+4.6,g.z,0.95),tb=rayCyl(o,dir,g.x,g.z,1.4,g.y,g.y+4.1);
      const okH=th>=minT,okB=tb>=minT;
      let t=-1,head=false;
      if(okH&&(!okB||th<=tb+0.6)){t=th;head=true;}else if(okB)t=tb;
      if(t>=0&&(!best||t<best.t))best={id,t,head};
    });
    const RANGE=w==='a'?160:700,wallT=rayBoxes(o,dir,RANGE);
    if(best&&wallT<best.t)best=null;

    const mz=muzzle(me3.g.position,P.rot),mv=end.clone().sub(mz),ml=mv.length()||1;
    mv.multiplyScalar(1/ml);

    if(tw<ml-0.2){end=mz.clone().addScaledVector(mv,tw);best=null;}
    addTracer(mz,end,w);
    let dmg=0;
    if(best)dmg=w==='a'?15:(best.head?150:120);
    sendNet({sk:++mySk,sw:w,st:best?best.id:'-',sd:dmg,ex:r2(end.x),ey:r2(end.y),ez:r2(end.z),ts:TS});

  function knife(){
    let best=null,bd=6.5;
    remotes.forEach((r,id)=>{
      if(!enemy(r))return;
      const gp=r.g.position,d=Math.hypot(gp.x-P.x,gp.z-P.z);
      if(d>=bd||Math.abs(gp.y-P.y)>4.5)return;
      const o=new THREE.Vector3(P.x,P.y+3,P.z),v=new THREE.Vector3(gp.x-P.x,gp.y-P.y,gp.z-P.z),L=v.length()||1;

    const g=best.r.g.position,dx=g.x-P.x,dz=g.z-P.z,d=Math.hypot(dx,dz)||1;

  async function netStart(){

  }

    const t=cleanMsg($('jgIn').value);
    if(!t||performance.now()-lastChat<800){closeChat();return;}
    lastChat=performance.now();myMk++;showBubble(me3,t);sendNet({m:t,mk:myMk});
    $('jgIn').value='';closeChat();
  }

  // ---------- 메인 루프 ----------
  function frame(ts){
    raf=requestAnimationFrame(frame);
    const dt=Math.min(0.05,Math.max(0,(ts-last)/1000));last=ts;P.t+=dt;
    P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);
    if(P.rl>0){P.rl-=dt;if(P.rl<=0){P.rl=0;P.ammo[P.rlw]=WEAP[P.rlw].mag;updHUD();}}
    if(P.dead){
      P.deadT-=dt;
      const d=$('jgDead');d.style.display='flex';d.textContent='💀 처치당했어요 · '+Math.max(1,Math.ceil(P.deadT))+'초 후 부활';
      if(P.deadT<=0)respawn();
    }
    let ix=joy.x,iy=joy.y;
    if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;
    if(keys.KeyW||keys.ArrowUp)iy+=1;if(keys.KeyS||keys.ArrowDown)iy-=1;
    if(P.dead){ix=iy=0;}
    const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}
    const s=Math.sin(yaw),c=Math.cos(yaw);
    const spd=SPEED*(P.scope?0.5:1);
    const mx=-s*iy+c*ix,mz=-c*iy-s*ix,moving=m>0.1,gun=P.w!=='k';
    P.mv=moving;
    if(moving){
      if(P.em)endEmote();
      moveXZ(mx*spd*dt,mz*spd*dt);
      if(!gun){let d=Math.atan2(mx,mz)-P.rot;d=Math.atan2(Math.sin(d),Math.cos(d));P.rot+=d*Math.min(1,dt*14);}
    }
    if(gun&&!P.em&&!P.dead){let d=yaw+Math.PI-P.rot;d=Math.atan2(Math.sin(d),Math.cos(d));P.rot+=d*Math.min(1,dt*18);}
    if(P.em){P.emT-=dt;if(P.em==='d')P.rot+=6*dt;if(P.emT<=0)endEmote();}
    P.x=Math.max(-LIM,Math.min(LIM,P.x));P.z=Math.max(-LIM,Math.min(LIM,P.z));
    const allow=P.grounded?2.3:0.3,gnd=groundAt(P.x,P.z,P.y,allow);
    if(!P.dead&&(jump||keys.Space)&&P.grounded){P.vy=JUMP;P.grounded=false;endEmote();}
    P.vy-=GRAV*dt;P.y+=P.vy*dt;
    if(P.y<=gnd&&P.vy<=0){P.y=gnd;P.vy=0;P.grounded=true;}else P.grounded=false;
    me3.g.position.set(P.x,P.y,P.z);me3.g.rotation.y=P.rot;
    me3.g.visible=!P.dead&&!(P.scope&&P.w==='s');
    animRig(me3,moving,!P.grounded,dt,P.em);
    // 발사
    if(!P.dead){
      const want=P.w==='a'?fireHeld:fireReq;
      if(want&&P.cd<=0)tryFire();
    }
    fireReq=false;
    // 내 위치 전송
    if(ready&&meRef){
      sendT+=dt;
      if(sendT>=0.08){
        sendT=0;
        const x=r2(P.x),y=r2(P.y),z=r2(P.z),r=r2(P.rot);
        if(x!==ls.x||y!==ls.y||z!==ls.z||r!==ls.r){ls={x,y,z,r};meRef.update({x,y,z,r,ts:TS}).catch(()=>{});}
      }
    }
    // 다른 플레이어
    const k=Math.min(1,dt*10);
    remotes.forEach(r=>{
      const g=r.g,px=g.position.x,pz=g.position.z;
      g.position.x+=(r.tx-px)*k;g.position.z+=(r.tz-pz)*k;g.position.y+=(r.ty-g.position.y)*k;
      let d=r.tr-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*k;
      const sp=Math.hypot(g.position.x-px,g.position.z-pz)/Math.max(dt,0.001);
      animRig(r,sp>2,g.position.y>groundAt(g.position.x,g.position.z,g.position.y,0.6)+0.2,dt,r.em);
    });
    // 총알 궤적
    for(let i=tracers.length-1;i>=0;i--){
      const t=tracers[i];t.life-=dt;
      if(t.life<=0){S.remove(t.m);tracers.splice(i,1);}
    }
    // 오래 신호 없는 플레이어 정리 (1초에 한 번)
    staleT+=dt;
    if(staleT>1){
      staleT=0;
      if(ready){
        const now=Date.now()+tOff;
        remotes.forEach((r,id)=>{
          const age=now-r.ts;
          r.stale=age>=20000;vis(r);
          if(age>60000&&refAll)refAll.child(id).remove().catch(()=>{});
        });
        updCount();updScore();
      }
    }
    // 3인칭(어깨 너머) 카메라
    camY+=(P.y-camY)*Math.min(1,dt*10);
    const tx=P.x,ty=camY+3.5,tz=P.z,cp=Math.cos(pitch),sh=P.scope?0:SH,rx=Math.cos(yaw),rz=-Math.sin(yaw);
    const ux=Math.sin(yaw)*cp,uy=Math.sin(pitch),uz=Math.cos(yaw)*cp;
    let cd=dist;
    {const tt=rayBoxes(new THREE.Vector3(tx,ty,tz),new THREE.Vector3(ux,uy,uz),dist+0.7);if(tt<dist+0.7)cd=Math.max(2,tt-0.7);}
    camD=cd;
    C.position.set(tx+cd*ux+rx*sh,ty+cd*uy,tz+cd*uz+rz*sh);
    C.lookAt(tx+rx*sh,ty,tz+rz*sh);
    const wf=P.scope&&P.w==='s'&&!P.dead?14:60;
    if(Math.abs(C.fov-wf)>0.05){C.fov+=(wf-C.fov)*Math.min(1,dt*14);C.updateProjectionMatrix();}
    R.render(S,C);
  }
  function open(){
    ov.style.display='block';jgOn=true;
    if(!inited)init();
    resize();
    myId=Math.random().toString(36).slice(2,10);myC=Math.floor(Math.random()*TORSO.length);
    myMk=0;mySk=0;
    Object.assign(P,{y:0,vy:0,em:'',emT:0,hp:HPMAX,dead:false,deadT:0,inv:2,w:'a',cd:0,rl:0,scope:false,kills:0,deaths:0});
    P.ammo.a=30;P.ammo.s=5;fireHeld=fireReq=false;
    spawnPos();pitch=0.25;dist=13;
    me3.torso.material.color.setHex(P.tm?TEAMC[P.tm]:TORSO[myC]);
    drawTag(me3.tag,myName,TEAMT[P.tm]||'#fff');
    setWeapon(me3,'a');me3.g.visible=me3.shadow.visible=true;me3.g.rotation.x=0;me3.bub.visible=false;me3.bubT=0;
    $('jgDead').style.display='none';$('jgFeed').innerHTML='';
    updHUD();updScore();
    netStart();
    const h=$('jgHint');h.style.opacity=1;clearTimeout(h._t);h._t=setTimeout(()=>{h.style.opacity=0;},7000);
    last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
  }
  function close(){
    netStop();
    ov.style.display='none';jgOn=false;cancelAnimationFrame(raf);
    joy.x=joy.y=0;jump=false;fireHeld=fireReq=false;for(const k in keys)keys[k]=false;
    closeChat();$('jgEmoP').style.display='none';
    if(R){R.domElement.style.filter='none';C.fov=60;C.updateProjectionMatrix();}
  }

  // 조이스틱 / 버튼
  const jz=$('jgJoy'),jk=$('jgKnob');let jid=null;
  function jmove(e){
    const r=jz.getBoundingClientRect(),R0=r.width/2-20;
    let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const l=Math.hypot(dx,dy);if(l>R0){dx*=R0/l;dy*=R0/l;}
    jk.style.transform='translate('+dx+'px,'+dy+'px)';
    joy.x=dx/R0;joy.y=-dy/R0;
    if(Math.hypot(joy.x,joy.y)<0.15)joy.x=joy.y=0;
  }
  jz.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;jz.setPointerCapture(jid);jmove(e);});
  jz.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e);});
  const jend=e=>{if(e.pointerId!==jid)return;jid=null;joy.x=joy.y=0;jk.style.transform='translate(0,0)';};
  jz.addEventListener('pointerup',jend);jz.addEventListener('pointercancel',jend);
  const jb=$('jgJump');
  jb.addEventListener('pointerdown',e=>{e.preventDefault();jump=true;});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>jb.addEventListener(t,()=>{jump=false;}));
  const fb=$('jgFire');
  fb.addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;fireReq=true;});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>fb.addEventListener(t,()=>{fireHeld=false;}));
  document.querySelectorAll('#jgWeap button').forEach(b=>{b.onclick=()=>setMyWeapon(b.dataset.w);});
  $('jgScopeB').onclick=toggleScope;
  $('jgRel').onclick=startReload;

  addEventListener('keydown',e=>{
    if(!jgOn)return;
    if(e.code==='Escape'){if(typing)closeChat();else close();return;}
    if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'&&!e.isComposing)sendChat();return;}
    if(e.code==='Enter'){e.preventDefault();openChat();return;}
    if(e.code==='KeyF'){if(!e.repeat)fireReq=true;fireHeld=true;return;}
    if(e.code==='KeyR'){startReload();return;}
    if(e.code==='KeyQ'){toggleScope();return;}
    if(e.code==='Digit1'){setMyWeapon('k');return;}
    if(e.code==='Digit2'){setMyWeapon('a');return;}
    if(e.code==='Digit3'){setMyWeapon('s');return;}
    keys[e.code]=true;
    if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  });
  addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyF')fireHeld=false;});
  addEventListener('resize',resize);
  addEventListener('pagehide',()=>{if(jgOn)netStop();});
  $('jgChatB').onclick=()=>{typing?closeChat():openChat();};
  $('jgSend').onclick=sendChat;
  $('jgEmoB').onclick=()=>{const p=$('jgEmoP');p.style.display=p.style.display==='flex'?'none':'flex';};
  $('jgEmoP').querySelectorAll('button').forEach(b=>{b.onclick=()=>{startEmote(b.dataset.e);$('jgEmoP').style.display='none';};});
  $('jgX').onclick=close;

  // 입장 전에 팀 + 닉네임 선택
  const clean=t=>String(t||'').replace(/[<>]/g,'').trim().slice(0,10);
  let saved='',savedTm=0;try{saved=localStorage.getItem('jgName')||'';savedTm=+localStorage.getItem('jgTm')||0;}catch(e){}
  $('bJun').onclick=()=>{
    box.innerHTML='<b>🎮 준닝이의 게임</b>'+
      '<div style="margin:10px 0 4px;font-size:13px;color:#555">팀 선택 (같은 팀끼리는 공격이 안 돼요)</div>'+
      '<div id="tmRow" style="display:flex;gap:6px;justify-content:center"><button data-t="1">🔴 레드팀</button><button data-t="2">🔵 블루팀</button><button data-t="0">⚪ 개인전</button></div>'+
      '<div style="margin:12px 0"><input id="jgName" maxlength="10" placeholder="닉네임" style="font:inherit;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:10px;width:min(70vw,240px);text-align:center;user-select:text;-webkit-user-select:text"></div>'+
      '<button id="jgGo" class="on">입장</button> <button id="jgNo">취소</button>';
    let tm=savedTm;
    const rows=[...$('tmRow').children],pick=t=>{tm=t;rows.forEach(b=>b.classList.toggle('on',+b.dataset.t===t));};
    rows.forEach(b=>{b.onclick=()=>pick(+b.dataset.t);});pick(tm);
    const inp=$('jgName');inp.value=saved||('손님'+Math.floor(100+Math.random()*900));
    const go=()=>{
      myName=clean(inp.value)||'손님';saved=myName;savedTm=tm;P.tm=tm;
      try{localStorage.setItem('jgName',myName);localStorage.setItem('jgTm',String(tm));}catch(e){}
      closeModal();open();
    };
    $('jgGo').onclick=go;$('jgNo').onclick=closeModal;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    modal.style.display='flex';
  };
})();

// ---------- 공유 / 스캔 ----------
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function encode(){ // 블록 1개 = 글자 3개 (x,z 5비트 / y 4비트 / 색 3비트 = 17비트→18비트)
  let s='';
  blocks.forEach(m=>{const u=m.userData;
    const v=(u.x<<13)|(u.z<<8)|(u.y<<4)|(u.c<<1);
    s+=B64[(v>>12)&63]+B64[(v>>6)&63]+B64[v&63];});
  return s;
}
function decode(s){
  s=s.trim();const i=s.indexOf('d=');if(i>=0)s=s.slice(i+2);
  s=s.replace(/[^A-Za-z0-9_-]/g,'');
  const list=[];
  for(let i=0;i+2<s.length;i+=3){
    const v=(B64.indexOf(s[i])<<12)|(B64.indexOf(s[i+1])<<6)|B64.indexOf(s[i+2]);
    list.push([(v>>13)&31,(v>>4)&15,(v>>8)&31,(v>>1)&7]);
  }
  return list;
}
function loadData(s){
  const list=decode(s);if(!list.length)return false;
  clearAll();list.forEach(([x,y,z,c])=>addBlock(x,y,z,c));return true;
}
const modal=$('modal'),box=$('box');
let stream=null,scanning=false;
function closeModal(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}modal.style.display='none';box.innerHTML='';}
modal.addEventListener('pointerdown',e=>{if(e.target===modal)closeModal();});
$('bShare').onclick=()=>{
  const here=location.href.split('#')[0];
  const own=/^https:/.test(here)&&!/claude/.test(location.hostname);
  const url=own?here:'https://claude.ai/artifact/YQR2kRTnnvZr1hSz3uRbTZ'; // 공유할 사이트 주소 (바꾸려면 여기 수정)
  const ok=/^https?:/.test(url);
  box.innerHTML='<b>사이트 공유 QR</b><div id="qr"></div>'+
    (ok?'<div style="font-size:12px;color:#555">카메라로 스캔하면 이 사이트가 열려요</div>'
       :'<div style="font-size:12px;color:#d33">지금은 파일로 열려 있어서 공유할 수 없어요.<br>사이트를 인터넷에 올린 주소(https)로 열면 QR이 만들어져요.</div>')+
    '<textarea readonly></textarea><div><button id="cp">링크 복사</button> <button id="cl">닫기</button></div>';
  box.querySelector('textarea').value=url;
  if(ok){try{new QRCode($('qr'),{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});}catch(e){$('qr').textContent='QR을 만들지 못했어요. 아래 링크를 복사해서 보내 주세요.';}}
  $('cp').onclick=()=>{box.querySelector('textarea').select();navigator.clipboard&&navigator.clipboard.writeText(url);};
  $('cl').onclick=closeModal;modal.style.display='flex';
};
$('bScan').onclick=async()=>{
  box.innerHTML='<b>QR 스캔</b><br><video playsinline muted></video><div style="font-size:12px;color:#555;margin:6px">QR 코드를 화면에 비춰 주세요</div><button id="cl">닫기</button>';
  $('cl').onclick=closeModal;modal.style.display='flex';
  const v=box.querySelector('video');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=stream;await v.play();scanning=true;
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const det=window.BarcodeDetector?new BarcodeDetector({formats:['qr_code']}):null;
    const loop=async()=>{
      if(!scanning)return;
      let txt=null;
      if(v.videoWidth){
        cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
        try{
          if(det){const r=await det.detect(cv);if(r[0])txt=r[0].rawValue;}
          else{const im=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(im.data,im.width,im.height);if(r)txt=r.data;}
        }catch(e){}
      }
      if(txt){if(/^https?:/.test(txt.trim())){location.href=txt.trim();return;}if(loadData(txt)){closeModal();return;}}
      requestAnimationFrame(loop);
    };loop();
  }catch(e){box.innerHTML='카메라를 사용할 수 없어요.<br>(https 주소이거나 카메라 권한이 필요해요)<br><br><button id="cl">닫기</button>';$('cl').onclick=closeModal;}
};

// ---------- 시작 ----------
if(location.hash.includes('d='))loadData(location.hash);
let shown=-1;
(function loop(){
  requestAnimationFrame(loop);
  if(spin)th+=0.008;
  if(goal){
    th+=(goal.th-th)*0.15;ph+=(goal.ph-ph)*0.15;dist+=(goal.d-dist)*0.15;target.lerp(goal.t,0.15);
    if(Math.abs(goal.th-th)<0.002&&Math.abs(goal.ph-ph)<0.002&&Math.abs(goal.d-dist)<0.05&&target.distanceTo(goal.t)<0.02){th=goal.th;ph=goal.ph;dist=goal.d;target.copy(goal.t);goal=null;}
  }
  if(blocks.size!==shown){shown=blocks.size;$('cnt').textContent='🧱 '+shown+'개';}
  stepBoom();updCam();
  if(shake>0.01){const k=shake*1.2;camera.position.x+=(Math.random()-.5)*k;camera.position.y+=(Math.random()-.5)*k;camera.position.z+=(Math.random()-.5)*k;shake*=0.92;}
  if(!jgOn)renderer.render(scene,camera);
})();
